name: Quality Gate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m ml.generate_dataset --scenarios 100 --seed 42
      - run: python -m ml.train_model
      - run: python scripts/check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: measured-evaluation
          path: |
            ml/outputs/*.json
            data/document_benchmark.json
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npx tsc --noEmit --incremental false
      - run: npm run build
